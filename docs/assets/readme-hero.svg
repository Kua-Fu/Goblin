<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-label="goblin local Codex project viewer">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.58" stop-color="#12221d"/>
      <stop offset="1" stop-color="#173327"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity=".98"/>
      <stop offset="1" stop-color="#e8fff3" stop-opacity=".96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1080" height="360" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#6ee7b7" stroke-width="1">
    <path d="M90 78h300M90 123h230M90 168h290M90 213h210M90 258h260"/>
    <path d="M760 66h180M760 105h140M760 144h190M760 183h120M760 222h170"/>
  </g>
  <g transform="translate(72 62)">
    <text x="0" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">goblin</text>
    <text x="2" y="96" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Local-first Codex project viewer</text>
    <text x="2" y="138" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="18">Projects, conversations, history, logs, processes, and shell snapshots.</text>
    <rect x="0" y="176" width="330" height="46" rx="23" fill="#10b981"/>
    <text x="24" y="205" fill="#052e22" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">All data stays on this machine</text>
  </g>
  <g transform="translate(492 48)" filter="url(#shadow)">
    <rect width="500" height="264" rx="20" fill="url(#panel)"/>
    <rect x="0" y="0" width="500" height="54" rx="20" fill="#ffffff"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="50" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="27" r="6" fill="#10b981"/>
    <text x="104" y="33" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">~/.codex overview</text>
    <g transform="translate(28 82)">
      <rect width="132" height="134" rx="14" fill="#ecfeff"/>
      <text x="18" y="34" fill="#155e75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">Projects</text>
      <text x="18" y="72" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">12</text>
      <path d="M18 98h90M18 116h64" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(184 82)">
      <rect width="132" height="134" rx="14" fill="#f0fdf4"/>
      <text x="18" y="34" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">Threads</text>
      <text x="18" y="72" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">148</text>
      <path d="M18 98h78M18 116h96" stroke="#86efac" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(340 82)">
      <rect width="132" height="134" rx="14" fill="#fefce8"/>
      <text x="18" y="34" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">Processes</text>
      <text x="18" y="72" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">31</text>
      <path d="M18 98h86M18 116h58" stroke="#fde047" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
