<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goblin</title>
    <link rel="icon" href="assets/goblin-logo.png" type="image/png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <img class="mark" src="assets/goblin-logo.png" alt="" aria-hidden="true" />
        <div>
          <h1>goblin</h1>
          <p data-i18n="privacy">所有数据只在本机读取和展示。</p>
        </div>
      </header>
      <label class="language-control" for="language-select">
        <span data-i18n="language">语言</span>
        <select id="language-select" aria-label="语言" data-i18n-attr="aria-label:language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <a class="primary" href="index.html" target="_blank" rel="noreferrer" data-i18n="open">打开 goblin</a>
      <button id="check-native-host" class="secondary" type="button" data-i18n="check">检查本机组件</button>
      <p id="status" class="status" data-i18n="statusIdle">完全本地运行，不上传、不埋点。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
